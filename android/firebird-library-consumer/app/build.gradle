plugins {
 id 'com.android.application'
}
android {
 compileSdk 32
 defaultConfig {
  applicationId 'org.rafaelia.firebird.libraryprobe'
  minSdk 24
  targetSdk 32
  versionCode 1
  versionName '0.1.0-libprobe'
 }
 buildTypes { release { minifyEnabled false } }
 compileOptions {
  sourceCompatibility JavaVersion.VERSION_1_8
  targetCompatibility JavaVersion.VERSION_1_8
 }
}
dependencies { implementation project(':embedded') }
